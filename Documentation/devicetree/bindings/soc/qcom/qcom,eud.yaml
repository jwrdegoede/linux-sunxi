%YAML 1.2
---
$id: http://devicetree.org/schemas/soc/qcom/qcom,eud.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Qualcomm Embedded USB Debugger

maintainers:
  - Souradeep Chowdhury <quic_schowdhu@quicinc.com>

description:
  This binding is used to describe the Qualcomm Embedded USB Debugger, which is
  mini USB-hub implemented on chip to support USB-based debug capabilities.

properties:
  compatible:
    items:
      - enum:
          - qcom,sc7280-eud
          - qcom,sm8350-eud
      - const: qcom,eud

  reg:
    items:
      - description: EUD Base Register Region
      - description: EUD Mode Manager Register

  interrupts:
    description: EUD interrupt
    maxItems: 1

  ports:
    $ref: /schemas/graph.yaml#/properties/ports
    description:
      These ports is to be attached to the endpoint of the DWC3 controller node
      and type C connector node. The controller has the "usb-role-switch"
      property.

    properties:
      port@0:
        $ref: /schemas/graph.yaml#/properties/port
        description: This port is to be attached to the DWC3 controller.

      port@1:
        $ref: /schemas/graph.yaml#/properties/port
        description: This port is to be attached to the type C connector.

  '#address-cells':
    const: 1

  '#size-cells':
    const: 0

patternProperties:
  "^eud-path@[0-1]$":
    type: object
    description:
      Represents one High-Speed UTMI path that EUD intercepts. Use eud-path nodes
      to associate role-switching behavior with specific port connections, allowing
      EUD to manage role transitions independently for each UTMI path.

    properties:
      reg:
        maxItems: 1
        description: Path number

      usb-role-switch:
        type: boolean
        description:
          Indicates that EUD relays USB role-switch events for this path and
          performs role-dependent UTMI routing accordingly. In device role,
          the EUD hub is inserted into this path to enable debug
          functionality. In host role, the EUD hub is bypassed and UTMI
          traffic flows directly between the PHY and the USB controller.

      ports:
        $ref: /schemas/graph.yaml#/properties/ports
        description:
          These ports are to be attached to the endpoint of the USB controller node
          and USB connector node.

        properties:
          port@0:
            $ref: /schemas/graph.yaml#/properties/port
            description: This port is to be attached to the USB controller.

          port@1:
            $ref: /schemas/graph.yaml#/properties/port
            description: This port is to be attached to the USB connector.

    required:
      - reg
      - ports

    additionalProperties: false

required:
  - compatible
  - reg

allOf:
  - if:
      properties:
        compatible:
          contains:
            const: qcom,sc7280-eud
    then:
      oneOf:
        - required:
            - ports
          properties:
            eud-path@0: false
            eud-path@1: false
        - required:
            - eud-path@0
            - '#address-cells'
            - '#size-cells'
          properties:
            ports: false
            eud-path@1: false
  - if:
      properties:
        compatible:
          contains:
            const: qcom,sm8350-eud
    then:
      required:
        - eud-path@0
        - eud-path@1
        - '#address-cells'
        - '#size-cells'
      properties:
        ports: false

additionalProperties: false

examples:
  - |
    eud@88e0000 {
        compatible = "qcom,sc7280-eud", "qcom,eud";
        reg = <0x88e0000 0x2000>,
              <0x88e2000 0x1000>;

        ports {
            #address-cells = <1>;
            #size-cells = <0>;
            port@0 {
                reg = <0>;
                eud_ep: endpoint {
                    remote-endpoint = <&usb2_role_switch>;
                };
            };

            port@1 {
                reg = <1>;
                eud_con: endpoint {
                    remote-endpoint = <&con_eud>;
                };
            };
        };
    };
  - |
    eud@88e0000 {
        compatible = "qcom,sm8350-eud", "qcom,eud";
        reg = <0x88e0000 0x2000>,
              <0x88e2000 0x1000>;
        #address-cells = <1>;
        #size-cells = <0>;

        eud-path@0 {
            reg = <0>;
            usb-role-switch;

            ports {
                #address-cells = <1>;
                #size-cells = <0>;
                port@0 {
                    reg = <0>;
                    eud_usb0: endpoint {
                        remote-endpoint = <&usb_1_dwc3_hs>;
                    };
                };

                port@1 {
                    reg = <1>;
                    eud_con0: endpoint {
                        remote-endpoint = <&pmic_glink_hs_in>;
                    };
                };
            };
        };

        eud-path@1 {
            reg = <1>;

            ports {
                #address-cells = <1>;
                #size-cells = <0>;
                port@0 {
                    reg = <0>;
                    eud_usb1: endpoint {
                        remote-endpoint = <&usb_2_dwc3_hs>;
                    };
                };

                port@1 {
                    reg = <1>;
                    eud_con1: endpoint {
                        remote-endpoint = <&conn_2_hs_in>;
                    };
                };
            };
        };
    };
